                                    value: {uid: groupIdString, name: DCGroup, description: 'This group represents Data Controller Users', isActive: true, users: []}
            description: "Removes a user from a group and returns the updated group.\n\nAdmin only. Refused with `400` for the reserved `public` group and with\n`405` when the group or the user is managed by an external auth provider."
            summary: 'Remove a user from a group'
            tags:
                - Group
            security:
                -
                    bearerAuth: []
            parameters:
                -
                    description: 'The group''s identifier'
                    in: path
                    name: groupUid
                    required: true
                    schema:
                        type: string
                    example: 12ByteString
                -
                    description: 'The user''s identifier'
                    in: path
                    name: userUid
                    required: true
                    schema:
                        type: string
                    example: 12ByteString
    /SASjsApi/info:
        get:
            operationId: Info
            responses:
                '200':
                    description: Ok
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InfoResponse'
                            examples:
                                'Example 1':
                                    value: {mode: desktop, cors: enable, protocol: http, runTimes: [sas, js], authProviders: [], oidcProviderName: 'OpenID Connect', localLoginEnabled: true}
            description: "Returns public information about this server instance: the mode it runs in\n(`server` or `desktop`), its CORS setting, the protocol it serves, the\navailable runtimes, the configured external authentication providers, and\nwhether password sign-in for local accounts is enabled.\n\nThis endpoint requires no authentication: the login screen reads it to\ndecide which sign-in methods to offer."
            summary: 'Get public server information'
            tags:
                - Info
            security: []
            parameters: []
    /SASjsApi/info/authorizedRoutes:
        get:
            operationId: AuthorizedRoutes
            responses:
                '200':
                    description: Ok
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuthorizedRoutesResponse'
                            examples:
                                'Example 1':
                                    value: {paths: [/AppStream, /SASjsApi/stp/execute]}
            description: "Returns every route to which a permission rule can be applied. The\npermissions dialog in the web interface uses this list to populate its\nchoices."
            summary: 'List the routes that accept permissions'
            tags:
                - Info
            security: []
            parameters: []
    /SASjsApi/info/myAuthorizedRoutes:
        get:
            operationId: MyAuthorizedRoutes
            responses:
                '200':
                    description: Ok
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuthorizedRoutesResponse'
                            examples:
                                'Example 1':
                                    value: {paths: [/AppStream, /SASjsApi/code/execute]}
            description: "Returns the routes this caller may use, taken from the routes that accept\npermission rules. The web interface reads it to hide the parts of itself\nthe caller cannot use - the Studio tab, for example - rather than offering\nan entry that only leads to a refusal.\n\nAdministrators hold every route, because the permission rules do not apply\nto them, and a public route is included for everyone. A `404` is returned\nwhen the caller has no account."
            summary: 'List the routes this caller may use'
            tags:
                - Info
            security:
                -
                    bearerAuth: []
            parameters: []
    /SASjsApi/permission:
        get:
            operationId: GetAllPermissions
            responses:
                '200':
                    description: Ok
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/PermissionDetailsResponse'
                                type: array
                            examples:
                                'Example 1':
                                    value: [{uid: permissionId1String, path: /SASjsApi/code/execute, type: Route, setting: Grant, user: {uid: user1-id, username: johnSnow01, displayName: 'John Snow', isAdmin: false}}, {uid: permissionId2String, path: /SASjsApi/code/execute, type: Route, setting: Grant, group: {uid: group1-id, name: DCGroup, description: 'This group represents Data Controller Users', isActive: true, users: []}}]
            description: "Returns the permission rules that apply to the authenticated user: the\nrules assigned to them directly and the rules assigned to any group they\nbelong to. An administrator receives every rule."
            summary: 'List the permission rules for the current user'
            tags:
                - Permission
            security:
                -
                    bearerAuth: []
            parameters: []
        post:
            operationId: CreatePermission
            responses:
                '200':
                    description: Ok
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PermissionDetailsResponse'
                            examples:
                                'Example 1':
                                    value: {uid: permissionIdString, path: /SASjsApi/code/execute, type: Route, setting: Grant, user: {uid: userIdString, username: johnSnow01, displayName: 'John Snow', isAdmin: false}}
            description: "Creates a permission rule granting or denying access to a route for a user\nor a group.\n\n`principalType` selects a user or a group and `principalId` is that\nprincipal's identifier. A `409` is returned when an identical rule already\nexists, and a `400` when the principal is an administrator. Admin only."
            summary: 'Create a permission rule'
            tags:
                - Permission
            security:
                -
                    bearerAuth: []
            parameters: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RegisterPermissionPayload'
    '/SASjsApi/permission/{uid}':
        patch:
            operationId: UpdatePermission
            responses:
                '200':
                    description: Ok
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PermissionDetailsResponse'
                            examples:
                                'Example 1':
                                    value: {uid: permissionIdString, path: /SASjsApi/code/execute, type: Route, setting: Grant, user: {uid: userIdString, username: johnSnow01, displayName: 'John Snow', isAdmin: false}}
            description: "Changes whether an existing permission rule grants or denies access.\n\nAdmin only. A `404` is returned when no rule has that identifier."
            summary: 'Update a permission rule'
            tags:
                - Permission
            security:
                -
                    bearerAuth: []
            parameters:
                -
                    description: 'The permission''s identifier'
                    in: path
                    name: uid
                    required: true
                    schema:
                        type: string
                    example: 507f1f77bcf86cd799439011
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdatePermissionPayload'
        delete:
            operationId: DeletePermission
            responses:
                '204':
                    description: 'No content'
            description: "Deletes a permission rule. Admin only. A `404` is returned when no rule has\nthat identifier."
            summary: 'Delete a permission rule'
            tags:
                - Permission
            security:
                -
                    bearerAuth: []
            parameters:
                -
                    description: 'The permission''s identifier'
                    in: path
                    name: uid
                    required: true
                    schema:
                        type: string
                    example: 507f1f77bcf86cd799439011
    /SASjsApi/session:
        get:
            operationId: Session
            responses:
                '200':
                    description: Ok
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SessionResponse'
                            examples:
                                'Example 1':
                                    value: {uid: userIdString, username: johnusername, displayName: John, isAdmin: false, needsToUpdatePassword: false}
            description: "Returns the properties of the authenticated user as held in the session:\ntheir id, username, display name, whether they are an administrator, and\nwhether they still have to change their password."
            summary: 'Get the current session'
            tags:
                - Session
            security:
                -
                    bearerAuth: []
            parameters: []
    '/SASjsApi/session/{sessionId}/state':
        get:
            operationId: SessionState
            responses:
                '200':
                    description: Ok
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SessionState'
                            examples:
                                'Example 1':
                                    value: completed
            description: "Returns the current state of a session created by `POST /SASjsApi/code/trigger`\nor `POST /SASjsApi/stp/trigger`.\n\nThe state is one of `initialising`, `pending`, `running`, `completed` or\n`failed`. A `404` is returned when no session has that id.\n\nPolling is implemented for single-server deployments only; load-balanced and\ngrid topologies are not yet supported. If your site requires this, please\ncontact SASjs Support."
            summary: 'Get the state of a session'
            tags:
                - Session
            security:
                -
                    bearerAuth: []
            parameters:
                -
                    in: path
                    name: sessionId
                    required: true
                    schema:
                        type: string
    /SASjsApi/stp/execute:
        get:
            operationId: ExecuteGetRequest
            responses:
                '200':
                    description: Ok
                    content:
                        application/json:
                            schema:
                                anyOf:
                                    - {type: string}
                                    - {type: string, format: byte}
            description: "Executes a stored program and returns its `_webout` content.\n\nThe program is identified by the `_program` query parameter. Any other query\nparameter is passed to the program as a session variable, and files may be\nuploaded as form fields. When `_debug` is set, the session log is appended\nto the response body. See https://server.sasjs.io/storedprograms."
            summary: 'Execute a stored program'
            tags:
                - STP
            security:
                -
                    bearerAuth: []
            parameters:
                -
                    description: 'Location of Stored Program in SASjs Drive.'
                    in: query
                    name: _program
                    required: true
                    schema:
                        type: string
                    example: /Projects/myApp/some/program
                -
                    description: 'Optional query param for setting debug mode (returns the session log in the response body).'
                    in: query
                    name: _debug
                    required: false
                    schema:
                        format: double
                        type: number
                    example: 131
        post:
            operationId: ExecutePostRequest
            responses:
                '200':
                    description: Ok
                    content:
                        application/json:
                            schema:
                                anyOf:
                                    - {type: string}
                                    - {type: string, format: byte}
            description: "Executes a stored program and returns its `_webout` content.\n\nThe program is identified by the `_program` query parameter or by\n`_program` in the body. Other body fields and query parameters are passed to\nthe program as session variables, and files may be uploaded as form fields.\nSee https://server.sasjs.io/storedprograms."
            summary: 'Execute a stored program'
            tags:
                - STP
            security:
                -
                    bearerAuth: []
            parameters:
                -
                    description: 'Location of code in SASjs Drive'
                    in: query
                    name: _program
                    required: false
                    schema:
                        type: string
                    example: /Projects/myApp/some/program
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ExecutePostRequestPayload'
    /SASjsApi/stp/trigger:
        post:
            operationId: TriggerProgram
            responses:
                '200':
                    description: Ok
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TriggerProgramResponse'
            description: "Starts a stored program and returns immediately, without waiting for it to\nfinish.\n\nThe response carries the `sessionId` of the session running the program.\nPoll `GET /SASjsApi/session/{sessionId}/state` for its state, or set\n`expiresAfterMins` to have the session destroyed that many minutes after it\ncompletes."
            summary: 'Trigger a stored program and return a session ID'
            tags:
                - STP
            security:
                -
                    bearerAuth: []
            parameters:
                -
                    description: 'Location of code in SASjs Drive.'
                    in: query
                    name: _program
                    required: true
                    schema:
                        type: string
                    example: /Projects/myApp/some/program
                -
                    description: 'Optional query param for setting debug mode.'
                    in: query
                    name: _debug
                    required: false
                    schema:
                        format: double
                        type: number
                    example: 131
                -
                    description: 'Optional query param for setting amount of minutes after the completion of the program when the session must be destroyed.'
                    in: query
                    name: expiresAfterMins
                    required: false
                    schema:
                        format: double
                        type: number
                    example: 15
    /:
        get:
            operationId: Home
            responses:
                '200':
                    description: Ok
                    content:
                        application/json:
                            schema:
                                type: string
            description: "Serves the web interface's `index.html`, with the current bundle version\nappended so a returning browser loads the updated bundle."
            summary: 'Serve the web interface'
            tags:
                - Web
            security: []
            parameters: []
    /SASLogon/login:
        post:
            operationId: Login
            responses:
                '200':
                    description: Ok
                    content:
                        application/json:
                            schema:
                                properties:
                                    user: {properties: {needsToUpdatePassword: {type: boolean}, isAdmin: {type: boolean}, displayName: {type: string}, username: {type: string}, uid: {type: string}}, required: [needsToUpdatePassword, isAdmin, displayName, username, uid], type: object}
                                    loggedIn: {type: boolean}
                                required:
                                    - user
                                    - loggedIn
                                type: object
            description: "Signs a user in with a username and password and starts a session.\n\nCredentials are checked against the local database or, for an account that\nauthenticates through LDAP, against the directory. A `401` is returned for\nunknown credentials, and also when password sign-in for local accounts is\ndisabled on the server."
            summary: 'Sign in with a username and password'
            tags:
                - Web
            security: []
            parameters: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LoginPayload'
    /SASLogon/authorize:
        post:
            operationId: Authorize
            responses:
                '200':
                    description: Ok
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuthorizeResponse'
                            examples:
                                'Example 1':
                                    value: {code: someRandomCryptoString}
            description: "Issues a short-lived, single-use authorization code for the signed-in user\nand the given client.\n\nThe code is exchanged for tokens at `POST /SASjsApi/auth/token`. A session\nis required; an unknown client id is rejected."
            summary: 'Issue an authorization code'
            tags:
                - Web
            security: []
            parameters: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AuthorizePayload'
    /SASLogon/logout:
        get:
            operationId: Logout
            responses:
                '200':
                    description: Ok
                    content:
                        application/json:
                            schema: {}
            description: "Ends the session held in the request cookie.\n\nThe session is REPLACED rather than destroyed: the browser keeps its\ncookies across a logout, so the route hands back a CSRF token bound to the\nnew session (see routes/web/web.ts). Destroying instead leaves the old\ntoken in place, bound to a session the server no longer has, and the next\nlogin is refused with `Invalid CSRF token!` (sasjs/server#304)."
            summary: 'Sign out'
            tags:
                - Web
            security: []
            parameters: []
servers:
    -
        url: /
tags:
    -
        name: Auth
        description: 'Sign-in, token exchange and password management'
    -
        name: 'Auth Config'
        description: 'Configuration of external authentication providers'
    -
        name: Client
        description: 'OAuth clients that SASjs applications authenticate with'
    -
        name: Code
        description: 'Execution of code in the supported runtimes (SAS, JS, Python, R)'
    -
        name: Drive
        description: 'Files and folders in SASjs Drive'
    -
        name: Group
        description: 'Groups and their memberships'
    -
        name: Info
        description: 'Public server information'
    -
        name: Permission
        description: 'Permission rules that grant or deny access to routes'
    -
        name: Session
        description: 'Session information and the state of triggered jobs'
    -
        name: STP
        description: 'Execution of Stored Programs held in SASjs Drive'
    -
        name: User
        description: 'User accounts'
    -
        name: Web
        description: 'Browser-facing endpoints that serve the web interface and its sign-in flow'
