components:
    examples: {}
    headers: {}
    parameters: {}
    requestBodies: {}
    responses: {}
    schemas:
        TokenResponse:
            properties:
                accessToken:
                    type: string
                    description: 'Access Token'
                    example: someRandomCryptoString
                refreshToken:
                    type: string
                    description: 'Refresh Token'
                    example: someRandomCryptoString
            required:
                - accessToken
                - refreshToken
            type: object
            additionalProperties: false
        TokenPayload:
            properties:
                clientId:
                    type: string
                    description: 'Client ID'
                    example: clientID1
                code:
                    type: string
                    description: 'Authorization code'
                    example: someRandomCryptoString
            required:
                - clientId
                - code
            type: object
            additionalProperties: false
        InfoJWT:
            properties:
                clientId:
                    type: string
                userId:
                    type: string
            required:
                - clientId
                - userId
            type: object
            additionalProperties: false
        UpdatePasswordPayload:
            properties:
                currentPassword:
                    type: string
                    description: 'Current Password'
                    example: currentPasswordString
                newPassword:
                    type: string
                    description: 'New Password'
                    example: newPassword
            required:
                - currentPassword
                - newPassword
            type: object
            additionalProperties: false
        ClientPayload:
            properties:
                clientId:
                    type: string
                    description: 'Client ID'
                    example: someFormattedClientID1234
                clientSecret:
                    type: string
                    description: 'Client Secret'
                    example: someRandomCryptoString
                accessTokenExpiration:
                    type: number
                    format: double
                    description: 'Number of seconds after which access token will expire. Default is 86400 (1 day)'
                    example: 86400
                refreshTokenExpiration:
                    type: number
                    format: double
                    description: 'Number of seconds after which access token will expire. Default is 2592000 (30 days)'
                    example: 2592000
            required:
                - clientId
                - clientSecret
            type: object
            additionalProperties: false
        RunTimeType:
            enum:
                - sas
                - js
                - py
                - r
                - sasviya
            type: string
        ExecuteCodePayload:
            properties:
                code:
                    type: string
                    description: 'The code to be executed'
                    example: '* Your Code HERE;'
                runTime:
                    $ref: '#/components/schemas/RunTimeType'
                    description: 'The runtime for the code - eg SAS, JS, PY or R'
                    example: js
            required:
                - code
                - runTime
            type: object
            additionalProperties: false
        TriggerCodeResponse:
            properties:
                sessionId:
                    type: string
                    description: "`sessionId` is the ID of the session and the name of the temporary folder\nused to store code outputs.<br><br>\nFor SAS, this would be the location of the SASWORK folder.<br><br>\n`sessionId` can be used to poll session state using the\nGET /SASjsApi/session/{sessionId}/state endpoint."
                    example: 20241028074744-54132-1730101664824
            required:
                - sessionId
            type: object
            additionalProperties: false
        TriggerCodePayload:
            properties:
                code:
                    type: string
                    description: 'The code to be executed'
                    example: '* Your Code HERE;'
                runTime:
                    $ref: '#/components/schemas/RunTimeType'
                    description: 'The runtime for the code - eg SAS, JS, PY or R'
                    example: sas
                expiresAfterMins:
                    type: number
                    format: double
                    description: "Amount of minutes after the completion of the job when the session must be\ndestroyed."
                    example: 15
            required:
                - code
                - runTime
            type: object
            additionalProperties: false
        Severity:
            description: 'Severity indicates the seriousness of a given violation.'
            enum:
                - 0
                - 1
                - 2
            type: number
        Diagnostic:
            description: 'A diagnostic is produced by the execution of a lint rule against a file or line of text.'
            properties:
                lineNumber:
                    type: number
                    format: double
                startColumnNumber:
                    type: number
                    format: double
                endColumnNumber:
                    type: number
                    format: double
                message:
                    type: string
                severity:
                    $ref: '#/components/schemas/Severity'
            required:
                - lineNumber
                - startColumnNumber
                - endColumnNumber
                - message
                - severity
            type: object
            additionalProperties: false
        LintCodePayload:
            properties:
                code:
                    type: string
                    description: 'The SAS code to be linted'
                    example: "data _null_;\n  x = 1;\nrun;"
                filePath:
                    type: string
                    description: "The drive path of the file the code comes from, when it has one. The rules\nresolve from the nearest `.sasjslint` at or above that file's folder, so\neach folder in the drive tree can carry its own rules. Omitted for an\nuntitled buffer, which lints against the drive-root rules."
                    example: /projects/app/run.sas
            required:
                - code
            type: object
            additionalProperties: false
        FormatCodePayload:
            properties:
                code:
                    type: string
                    description: 'The SAS code to be formatted'
                    example: "data _null_;\n  x = 1;\nrun;"
                filePath:
                    type: string
                    description: "The drive path of the file the code comes from, when it has one. The rules\nresolve from the nearest `.sasjslint` at or above that file's folder, so\neach folder in the drive tree can carry its own rules. Omitted for an\nuntitled buffer, which formats against the drive-root rules."
                    example: /projects/app/run.sas
            required:
                - code
            type: object
            additionalProperties: false
        MemberType.folder:
            enum:
                - folder
            type: string
        FolderMember:
            properties:
                name:
                    type: string
                type:
                    $ref: '#/components/schemas/MemberType.folder'
                members:
                    items:
                        anyOf:
                            -
                                $ref: '#/components/schemas/FolderMember'
                            -
                                $ref: '#/components/schemas/ServiceMember'
                            -
                                $ref: '#/components/schemas/FileMember'
                    type: array
            required:
                - name
                - type
                - members
            type: object
            additionalProperties: false
        MemberType.service:
            enum:
                - service
            type: string
        ServiceMember:
            properties:
                name:
                    type: string
                type:
                    $ref: '#/components/schemas/MemberType.service'
                code:
                    type: string
            required:
                - name
                - type
                - code
            type: object
            additionalProperties: false
        MemberType.file:
            enum:
                - file
            type: string
        FileMember:
            properties:
                name:
                    type: string
                type:
                    $ref: '#/components/schemas/MemberType.file'
                code:
                    type: string
            required:
                - name
                - type
                - code
            type: object
            additionalProperties: false
        FileTree:
            properties:
                members:
                    items:
                        anyOf:
                            -
                                $ref: '#/components/schemas/FolderMember'
                            -
                                $ref: '#/components/schemas/ServiceMember'
                            -
                                $ref: '#/components/schemas/FileMember'
                    type: array
            required:
                - members
            type: object
            additionalProperties: false
        DeployResponse:
            properties:
                status:
                    type: string
                message:
                    type: string
                streamServiceName:
                    type: string
                example:
                    $ref: '#/components/schemas/FileTree'
            required:
                - status
                - message
            type: object
            additionalProperties: false
        DeployPayload:
            properties:
                appLoc:
                    type: string
                streamWebFolder:
                    type: string
                fileTree:
                    $ref: '#/components/schemas/FileTree'
            required:
                - appLoc
                - fileTree
            type: object
            additionalProperties: false
        FileFolderResponse:
            properties:
                status:
                    type: string
                message:
                    type: string
            required:
                - status
            type: object
            additionalProperties: false
        AddFolderPayload:
            properties:
                folderPath:
                    type: string
                    description: 'Location of folder'
                    example: /Public/someFolder
            required:
                - folderPath
            type: object
            additionalProperties: false
        RenamePayload:
            properties:
                oldPath:
                    type: string
                    description: 'Old path of file/folder'
                    example: /Public/someFolder
                newPath:
                    type: string
                    description: 'New path of file/folder'
                    example: /Public/newFolder
            required:
                - oldPath
                - newPath
            type: object
            additionalProperties: false
        TreeNode:
            properties:
                name:
                    type: string
                relativePath:
                    type: string
                absolutePath:
                    type: string
                isFolder:
                    type: boolean
                children:
                    items:
                        $ref: '#/components/schemas/TreeNode'
                    type: array
            required:
                - name
                - relativePath
                - absolutePath
                - isFolder
                - children
            type: object
            additionalProperties: false
        GetFileTreeResponse:
            properties:
                status:
                    type: string
                tree:
                    $ref: '#/components/schemas/TreeNode'
            required:
                - status
                - tree
            type: object
            additionalProperties: false
        UserResponse:
            properties:
                uid:
                    type: string
                username:
                    type: string
                displayName:
                    type: string
                isAdmin:
                    type: boolean
            required:
                - uid
                - username
                - displayName
                - isAdmin
            type: object
            additionalProperties: false
        GroupResponse:
            properties:
                uid:
                    type: string
                name:
                    type: string
                description:
                    type: string
            required:
                - uid
                - name
                - description
            type: object
            additionalProperties: false
        UserDetailsResponse:
            properties:
                uid:
                    type: string
                username:
                    type: string
                displayName:
                    type: string
                isAdmin:
                    type: boolean
                isActive:
                    type: boolean
                autoExec:
                    type: string
                groups:
                    items:
                        $ref: '#/components/schemas/GroupResponse'
                    type: array
            required:
                - uid
                - username
                - displayName
                - isAdmin
                - isActive
            type: object
            additionalProperties: false
        UserPayload:
            properties:
                displayName:
                    type: string
                    description: 'Display name for user'
                    example: 'John Snow'
                username:
                    type: string
                    description: 'Username for user'
                    example: johnSnow01
                password:
                    type: string
                    description: 'Password for user'
                isAdmin:
                    type: boolean
                    description: 'Account should be admin or not, defaults to false'
                    example: 'false'
                isActive:
                    type: boolean
                    description: 'Account should be active or not, defaults to true'
                    example: 'true'
                autoExec:
                    type: string
                    description: 'User-specific auto-exec code'
                    example: ""
            required:
                - displayName
                - username
                - password
            type: object
            additionalProperties: false
        GroupDetailsResponse:
            properties:
                uid:
                    type: string
                name:
                    type: string
                description:
                    type: string
                isActive:
                    type: boolean
                users:
                    items:
                        $ref: '#/components/schemas/UserResponse'
                    type: array
            required:
                - uid
                - name
                - description
                - isActive
                - users
            type: object
            additionalProperties: false
        GroupPayload:
            properties:
                name:
                    type: string
                    description: 'Name of the group'
                    example: DCGroup
                description:
                    type: string
                    description: 'Description of the group'
                    example: 'This group represents Data Controller Users'
                isActive:
                    type: boolean
                    description: 'Group should be active or not, defaults to true'
                    example: 'true'
            required:
                - name
                - description
            type: object
            additionalProperties: false
        DeleteResult:
            properties:
                acknowledged:
                    type: boolean
                    description: 'Indicates whether this write result was acknowledged. If not, then all other members of this result will be undefined.'
                deletedCount:
                    type: number
                    format: double
                    description: 'The number of documents that were deleted'
            required:
                - acknowledged
                - deletedCount
            type: object
            additionalProperties: false
        InfoResponse:
            properties:
                mode:
                    type: string
                cors:
                    type: string
                protocol:
                    type: string
                runTimes:
                    items:
                        type: string
                    type: array
                authProviders:
                    items:
                        type: string
                    type: array
                    description: "Which external authentication providers are configured. Public, because\nthe login screen needs it before anyone is authenticated: it decides\nwhether to offer a single sign-on button."
                oidcProviderName:
                    type: string
                    description: "The label for that button, from OIDC_PROVIDER_NAME. Absent unless OIDC is\nconfigured. Not sensitive - it is a display name."
                localLoginEnabled:
                    type: boolean
                    description: "Whether password sign-in for local (database) accounts is switched on,\nfrom LOCAL_LOGIN_ENABLED. Public for the same reason as authProviders:\nthe login screen must not offer a form the server refuses to accept."
            required:
                - mode
                - cors
                - protocol
                - runTimes
                - authProviders
                - localLoginEnabled
            type: object
            additionalProperties: false
        AuthorizedRoutesResponse:
            properties:
                paths:
                    items:
                        type: string
                    type: array
            required:
                - paths
            type: object
            additionalProperties: false
        PermissionDetailsResponse:
            properties:
                uid:
                    type: string
                path:
                    type: string
                type:
                    type: string
                setting:
                    type: string
                user:
                    $ref: '#/components/schemas/UserResponse'
                group:
                    $ref: '#/components/schemas/GroupDetailsResponse'
            required:
                - uid
                - path
                - type
                - setting
            type: object
            additionalProperties: false
        PermissionType:
            enum:
                - Route
            type: string
        PermissionSettingForRoute:
            enum:
                - Grant
                - Deny
            type: string
        PrincipalType:
            enum:
                - user
                - group
            type: string
        RegisterPermissionPayload:
            properties:
                path:
                    type: string
                    description: 'Name of affected resource'
                    example: /SASjsApi/code/execute
                type:
                    $ref: '#/components/schemas/PermissionType'
                    description: 'Type of affected resource'
                    example: Route
                setting:
                    $ref: '#/components/schemas/PermissionSettingForRoute'
                    description: 'The indication of whether (and to what extent) access is provided'
                    example: Grant
                principalType:
                    $ref: '#/components/schemas/PrincipalType'
                    description: 'Indicates the type of principal'
                    example: user
                principalId:
                    type: string
                    description: 'The id of user or group to which a rule is assigned.'
            required:
                - path
                - type
                - setting
                - principalType
                - principalId
            type: object
            additionalProperties: false
        UpdatePermissionPayload:
            properties:
                setting:
                    $ref: '#/components/schemas/PermissionSettingForRoute'
                    description: 'The indication of whether (and to what extent) access is provided'
                    example: Grant
            required:
                - setting
            type: object
            additionalProperties: false
        SessionResponse:
            properties:
                uid:
                    type: string
                username:
                    type: string
                displayName:
                    type: string
                isAdmin:
                    type: boolean
                needsToUpdatePassword:
                    type: boolean
            required:
                - uid
                - username
                - displayName
                - isAdmin
            type: object
            additionalProperties: false
        SessionState:
            enum:
                - initialising
                - pending
                - running
                - completed
                - failed
            type: string
        ExecutePostRequestPayload:
            properties:
                _program:
                    type: string
                    description: 'Location of SAS program'
                    example: /Public/somefolder/some.file
            type: object
            additionalProperties: false
        TriggerProgramResponse:
            properties:
                sessionId:
                    type: string
                    description: "`sessionId` is the ID of the session and the name of the temporary folder\nused to store program outputs.<br><br>\nFor SAS, this would be the location of the SASWORK folder.<br><br>\n`sessionId` can be used to poll session state using the\nGET /SASjsApi/session/{sessionId}/state endpoint."
                    example: 20241028074744-54132-1730101664824
            required:
                - sessionId
            type: object
            additionalProperties: false
        LoginPayload:
            properties:
                username:
                    type: string
                    description: 'Username for user'
                    example: secretuser
                password:
                    type: string
                    description: 'Password for user'
                    example: secretpassword
            required:
                - username
                - password
            type: object
            additionalProperties: false
        AuthorizeResponse:
            properties:
                code:
                    type: string
                    description: 'Authorization code'
                    example: someRandomCryptoString
            required:
                - code
            type: object
            additionalProperties: false
        AuthorizePayload:
            properties:
                clientId:
                    type: string
                    description: 'Client ID'
                    example: clientID1
            required:
                - clientId
            type: object
            additionalProperties: false
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
info:
    title: 'SASjs Server API'
    version: 0.0.2
    description: 'REST API for SASjs Server, the NodeJS wrapper around the SAS binary. Authenticate with a bearer token (see the **Auth** tag) or, for browser clients, with a session cookie.'
    license:
        name: MIT
    contact:
        name: SASjs
        url: 'https://sasjs.io'
openapi: 3.0.0
paths:
    /SASjsApi/auth/token:
        post:
            operationId: Token
            responses:
                '200':
                    description: Ok
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TokenResponse'
                            examples:
                                'Example 1':
                                    value: {accessToken: someRandomCryptoString, refreshToken: someRandomCryptoString}
            description: "Exchanges an authorization code for a token pair.\n\nThe code is single-use, short-lived, and is issued by\n`POST /SASLogon/authorize` to a caller that already holds a session. This\nendpoint requires no authentication of its own: the code is the credential."
            summary: 'Exchange an authorization code for tokens'
            tags:
                - Auth
            security: []
            parameters: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TokenPayload'
    /SASjsApi/auth/refresh:
        post:
            operationId: Refresh
            responses:
                '200':
                    description: Ok
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TokenResponse'
                            examples:
                                'Example 1':
                                    value: {accessToken: someRandomCryptoString, refreshToken: someRandomCryptoString}
            description: "Issues a new access and refresh token pair for the caller identified by the\nbearer token. The previous pair is replaced."
            summary: 'Refresh the access and refresh tokens'
            tags:
                - Auth
            security:
                -
                    bearerAuth: []
            parameters: []
    /SASjsApi/auth/logout:
        post:
            operationId: Logout
            responses:
                '204':
                    description: 'No content'
            description: 'Revokes the access and refresh tokens of the caller and returns no content.'
            summary: 'Revoke the current tokens'
            tags:
                - Auth
            security:
                -
                    bearerAuth: []
            parameters: []
    /SASjsApi/auth/updatePassword:
        patch:
            operationId: UpdatePassword
            responses:
                '204':
                    description: 'No content'
            description: "Changes the password of the authenticated user.\n\nThe current password must be supplied and must match. The request is refused\nwith `405` for an account that authenticates through an external provider\n(LDAP or OpenID Connect), whose password is not held here."
            summary: 'Change the current user''s password'
            tags:
                - Auth
            security:
                -
                    bearerAuth: []
            parameters: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdatePasswordPayload'
    /SASjsApi/authConfig:
        get:
            operationId: GetDetail
            responses:
                '200':
                    description: Ok
                    content:
                        application/json:
                            schema: {}
                            examples:
                                'Example 1':
                                    value: {ldap: {LDAP_URL: 'ldaps://my.ldap.server:636', LDAP_BIND_DN: 'cn=admin,ou=system,dc=cloudron', LDAP_USERS_BASE_DN: 'ou=users,dc=cloudron', LDAP_GROUPS_BASE_DN: 'ou=groups,dc=cloudron', LDAP_BIND_PASSWORD_SET: true}}
            description: "Returns the non-secret configuration of each enabled authentication\nprovider, for display in the administration interface.\n\nSecrets are never echoed: for each provider the response reports only\nwhether its bind password or client secret is set (`LDAP_BIND_PASSWORD_SET`,\n`OIDC_CLIENT_SECRET_SET`). Admin only."
            summary: 'Get the configured authentication providers'
            tags:
                - 'Auth Config'
            security:
                -
                    bearerAuth: []
            parameters: []
    /SASjsApi/authConfig/synchroniseWithLDAP:
        post:
            operationId: SynchroniseWithLDAP
            responses:
                '200':
                    description: Ok
                    content:
                        application/json:
                            schema:
                                properties:
                                    groupCount: {type: number, format: double}
                                    userCount: {type: number, format: double}
                                required:
                                    - groupCount
                                    - userCount
                                type: object
                            examples:
                                'Example 1':
                                    value: {users: 5, groups: 3}
            description: "Imports the users and groups of the configured LDAP directory into the\ninternal database and returns the number imported.\n\nUsers and groups that already exist are left untouched. Admin only."
            summary: 'Import users and groups from LDAP'
            tags:
                - 'Auth Config'
            security:
                -
                    bearerAuth: []
            parameters: []
    /SASjsApi/client:
        post:
            operationId: CreateClient
            responses:
                '200':
                    description: Ok
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ClientPayload'
                            examples:
                                'Example 1':
                                    value: {clientId: someFormattedClientID1234, clientSecret: someRandomCryptoString, accessTokenExpiration: 86400}
            description: "Registers a new OAuth client that SASjs applications can authenticate with.\n\nA client is identified by `clientId` and `clientSecret`. The two optional\nfields set token lifetimes in seconds; when omitted, the defaults of 86400\n(one day) for the access token and 2592000 (30 days) for the refresh token\napply. Admin only."
            summary: 'Create a client'
            tags:
                - Client
            security:
                -
                    bearerAuth: []
            parameters: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ClientPayload'
        get:
            operationId: GetAllClients
            responses:
                '200':
                    description: Ok
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/ClientPayload'
                                type: array
                            examples:
                                'Example 1':
                                    value: [{clientId: someClientID1234, clientSecret: someRandomCryptoString, accessTokenExpiration: 86400}, {clientId: someOtherClientID, clientSecret: someOtherRandomCryptoString, accessTokenExpiration: 86400}]
            description: "Returns every registered client with its id, secret and token lifetimes.\nAdmin only."
            summary: 'List all clients'
            tags:
                - Client
            security:
                -
                    bearerAuth: []
            parameters: []
    /SASjsApi/code/execute:
        post:
            operationId: ExecuteCode
            responses:
                '200':
                    description: Ok
                    content:
                        application/json:
                            schema:
                                anyOf:
                                    - {type: string}
                                    - {type: string, format: byte}
            description: "Runs the supplied code on the requested runtime and returns its output.\n\nThe response body is assembled from the parts the program produced, joined\nwith newlines and separated by a UUID that marks the boundaries of the log:\n\n1. Webout - the `_webout` content, omitted when the program writes none\n2. Logs UUID - the server's identifier opening the log section\n3. Log - the program log\n4. Logs UUID - the same identifier closing the log section\n5. Print - the SAS listing, present only for the `sas` runtime\n\nThis endpoint waits for the program to finish. To start a program and poll\nfor its result instead, use `POST /SASjsApi/code/trigger`. See\nhttps://server.sasjs.io/ for the available runtimes."
            summary: 'Execute code and return its output'
            tags:
                - Code
            security:
                -
                    bearerAuth: []
            parameters: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ExecuteCodePayload'
    /SASjsApi/code/trigger:
        post:
            operationId: TriggerCode
            responses:
                '200':
                    description: Ok
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TriggerCodeResponse'
            description: "Starts the supplied code on the requested runtime and returns immediately,\nwithout waiting for it to finish.\n\nThe response carries the `sessionId` of the session running the code. Poll\n`GET /SASjsApi/session/{sessionId}/state` for its state, or set\n`expiresAfterMins` to have the session destroyed that many minutes after it\ncompletes. See https://server.sasjs.io/ for the available runtimes."
            summary: 'Trigger code and return a session ID'
            tags:
                - Code
            security:
                -
                    bearerAuth: []
            parameters: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TriggerCodePayload'
    /SASjsApi/code/lint:
        post:
            operationId: LintCode
            responses:
                '200':
                    description: Ok
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/Diagnostic'
                                type: array
            description: "Lints the supplied SAS code and returns the diagnostics.\n\nThe code is submitted in the request rather than named as a file, so an\neditor can lint its buffer, including unsaved changes, and no drive\npermission is involved. Nothing is executed.\n\nWhen the request names the file's drive path, the rules come from the\nnearest `.sasjslint` at or above that file's folder, so each folder in\nthe drive tree can carry its own rules; a request without a path lints\nagainst the drive-root rules file. Diagnostics describe the submitted\ntext only; no other file is read."
            summary: 'Lint SAS code and return the diagnostics'
            tags:
                - Code
            security:
                -
                    bearerAuth: []
            parameters: []
            requestBody:
                required: true
                content:
                    application/json:
