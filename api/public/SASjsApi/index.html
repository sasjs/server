<!doctype html>
<!--
  The API documentation page for SASjs Server.

  Everything it loads is served from this folder: the assets beside it are copied
  from the pinned swagger-ui-dist devDependency at build time, so the page makes
  no request to a third party - not for the assets and not for the spec.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SASjs Server API</title>
    <link rel="icon" type="image/png" href="./favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="./favicon-16x16.png" sizes="16x16" />
    <link rel="stylesheet" href="./swagger-ui.css" />
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="./swagger-ui-bundle.js"></script>
    <script src="./swagger-ui-standalone-preset.js"></script>
    <script src="./swagger-ui-init.js"></script>
  </body>
</html>
