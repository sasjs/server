name: Executable Smoke Test

# The packaged executables run on the small-icu Node that `pkg` embeds, which is
# a different runtime from the one every other job uses - `build.yml` boots
# `node build/src/server.js` on the runner's full-icu Node, where a logging or
# startup regression in the packaged shape cannot show up at all. v3.10.0,
# v3.11.0 and v3.11.1 therefore shipped binaries that died on their first log
# line while every unit and integration job stayed green.
#
# Each runner builds its OWN platform target and starts it: a cross-built binary
# cannot be executed here, so this is the only job that runs the Windows and
# macOS artefacts anywhere.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: node24-linux-x64
            platform: linux
            arch: x64
            output: ../executables/api-linux
            name: api-linux
          - os: windows-latest
            target: node24-win-x64
            platform: win
            arch: x64
            output: ../executables/api-win.exe
            name: api-win.exe
          # The target is x64 and the runner image is arm64, so the binary runs
          # under Rosetta 2 - which is the only way to execute the macOS
          # artefact anywhere in CI. Its absence would fail the boot step rather
          # than pass silently.
          - os: macos-latest
            target: node24-macos-x64
            platform: macos
            arch: x64
            output: ../executables/api-macos
            name: api-macos

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js lts/*
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install Dependencies WEB
        working-directory: ./web
        run: npm ci

      - name: Build WEB
        working-directory: ./web
        run: npm run build

      - name: Install Dependencies API
        working-directory: ./api
        run: npm ci

      # `pkg` downloads a base Node binary and, when that download fails, BUILDS
      # Node from source - a twenty-five minute detour that cannot succeed on
      # this image, where deps/ada/ada.h calls a constexpr std::string member
      # that gcc 12 does not provide. So a 504 from the release CDN reads as a
      # compiler error in this repository: on 2026-11-08 every executable job
      # failed that way at once, with `504: Gateway Time-out` three lines above
      # the `ada.h` errors. The binary is fetched here instead - retried, cached
      # between runs, and with an error that names the real cause.
      #
      # The runner stays on ubuntu-22.04 deliberately: the binary it produces
      # carries that glibc forward, and moving to 24.04 would drop every host
      # older than it (RHEL 9 ships glibc 2.34). The base binary is the thing to
      # make reliable, not the image.
      - name: Restore the pkg base binary
        id: pkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pkg-cache
          key: pkg-cache-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('api/package-lock.json') }}

      - name: Fetch the pkg base binary
        shell: bash
        working-directory: ./api
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          # Each attempt is bounded: a 504 from the CDN can take minutes to come
          # back, and the point of this step is to fail quickly and say why. Node
          # runs the call rather than `timeout(1)`, which is absent on macOS.
          fetch() {
            node -e '
              const { spawnSync } = require("child_process")
              const args = ["--no-install", "pkg-fetch", "--node-range", "node24",
                            "--platform", process.argv[1], "--arch", process.argv[2]]
              const result = spawnSync("npx", args, {
                stdio: "inherit",
                timeout: 90000,
                shell: process.platform === "win32"
              })
              process.exit(result.status === null ? 1 : result.status)
            ' "$1" "$2"
          }
          for attempt in 1 2 3; do
            if fetch "$PLATFORM" "$ARCH"; then
              echo "base binary ready for $PLATFORM-$ARCH"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "attempt $attempt failed; waiting $((attempt * 15))s"
              sleep $((attempt * 15))
            fi
          done
          echo "::error::pkg-fetch could not download the base Node binary after 3 attempts. This is the GitHub release CDN, not a change in this branch; the same download answers 504 from outside CI when it happens."
          exit 1

      - name: Save the pkg base binary
        if: success() && steps.pkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pkg-cache
          key: ${{ steps.pkg-cache.outputs.cache-primary-key }}

      - name: Build API
        working-directory: ./api
        run: npm run build
        env:
          # The api build lists the SAS_PACKAGES macros over the GitHub API,
          # which rate limits unauthenticated requests per source IP.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # One target on purpose: this runner can execute only its own platform's
      # binary, so building the others would add minutes and prove nothing.
      # `--output` is explicit because pkg omits the platform suffix when a
      # single target is named, whereas the release ships api-linux, api-macos
      # and api-win.exe. `--no-install` keeps the pin: pkg resolves from the
      # lockfile's devDependency, and a missing one fails instead of fetching
      # whatever the registry serves today.
      - name: Build the ${{ matrix.target }} executable
        working-directory: ./api
        run: npx --no-install pkg . --targets ${{ matrix.target }} --output ${{ matrix.output }}

      - name: Boot the executable
        run: node .github/scripts/smoke-executable.mjs executables/${{ matrix.name }}
