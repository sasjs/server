name: Mock site

# Publishes the demonstration site: the real interface, running against a
# browser host instead of a server. Built from the same source as the app, so a
# screen and the site showing it are never a release apart.
#
# Run by hand, and on a release. It is deliberately NOT part of the pull-request
# pipeline: it needs the released @sasjs/cli (see mock/build.mjs), and a demo
# that breaks CI is a demo someone will disable.

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: mock-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            api/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The docs are built into the web bundle, so the site carries the pages
      # that describe the build it was made from.
      - name: Docs dependencies
        run: pip install -r docs/requirements.txt

      - name: Web dependencies
        run: npm ci --prefix web

      - name: Build the mock site
        run: npm run mock:build

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./sasjsbuild/mock
          publish_branch: gh-pages
          # the site is served from its own subdomain, so no /<repo>/ prefix
          cname: demo.server.sasjs.io
          user_name: sasjs
          user_email: sasjs@4gl.io
          commit_message: 'chore(mock): publish the demonstration site'
