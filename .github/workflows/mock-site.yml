name: Mock site

# Publishes the site: the real interface, running against a browser host instead
# of a server, at https://server.sasjs.io. Built from the same source as the app,
# so a screen and the site showing it are never a release apart.
#
# The documentation is part of this site - it is built into the web bundle and
# served at /docs - so this job publishes it too. There is no separate docs
# publish any more: two jobs writing one branch meant whichever ran last decided
# whether server.sasjs.io served the app or the pages.
#
# Runs on every push to main, by hand, and once a day. The daily run exists
# because the three apps it publishes follow their repositories' newest releases
# (see mock/apps.mjs): a release should reach the demo on its own, and a rebuild
# is the only thing that picks it up. It is deliberately NOT part of the
# pull-request pipeline: it needs the released @sasjs/cli (see mock/build.mjs),
# and a demo that breaks CI is a demo someone will disable.
#
# NOT on `release: published`. release.yml cuts the release with semantic-release
# authenticated by the repository's GITHUB_TOKEN, and GitHub does not start a
# workflow from an event that token created - only workflow_dispatch and
# repository_dispatch are exempt. So the release trigger read as "publishes on
# every release" and never fired at all: every run in this workflow's history is
# a manual dispatch, and after six releases the site was still built from a commit
# 35 behind main. A push to main is the event that actually happens when the
# source the site is built from changes.

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # A daily rebuild, because the apps this site publishes follow each
    # repository's newest release rather than a tag pinned here: without it a
    # release would reach the demo only when somebody happened to push.
    - cron: '17 5 * * *'

permissions:
  contents: write

concurrency:
  group: mock-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The rest of the pipeline's LTS. Node 20 cannot load the TypeScript
          # webpack config: type stripping arrives in 22 (behind a flag) and is
          # the default from 23, which is what this build relies on.
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            api/package-lock.json

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: '3.12'

      # The docs are built into the web bundle, so the site carries the pages
      # that describe the build it was made from.
      - name: Docs dependencies
        run: pip install -r docs/requirements.txt

      - name: Web dependencies
        run: npm ci --prefix web

      # The API documentation page's stylesheet and bundle are generated from
      # swagger-ui-dist, which the API installs - without this the site would
      # carry a page with nothing to draw it with.
      - name: API dependencies
        run: npm ci --prefix api

      - name: Test the build's retry, which only fails in a deploy otherwise
        run: npm run mock:test

      # The API's documentation page is part of the site: the interface links to
      # /api, and mock/build.mjs copies api/public/SASjsApi into the output so a
      # static host can answer it. The swagger-ui assets beside index.html come
      # from swagger-ui-dist, which this step installs into that folder - without
      # it there is an index.html with nothing to load, so the copy is skipped.
      - name: API dependencies
        run: npm ci --prefix api

      - name: API documentation assets
        run: npm run swagger-ui:copy --prefix api

      - name: Build the mock site
        run: npm run mock:build

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./sasjsbuild/mock
          publish_branch: gh-pages
          # the site is served from its own subdomain, so no /<repo>/ prefix
          cname: server.sasjs.io
          user_name: sasjs
          user_email: sasjs@4gl.io
          commit_message: 'chore(mock): publish the demonstration site'
