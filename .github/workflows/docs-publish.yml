# Publishes the documentation site to GitHub Pages.
#
# The pages live in docs/ in this repository, so the site is built from the same
# source as the build it ships inside - and https://server.sasjs.io is served
# from that build. It runs only when docs/ changes, so a code release does not
# redeploy a site that did not move.
#
# The toolchain is pinned in docs/requirements.txt and installed by this job, so
# a deploy is reproducible: same MkDocs, same theme, same plugins as the copy in
# the build.
name: Publish docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write # peaceiris/actions-gh-pages pushes the gh-pages branch

concurrency:
  group: publish-docs
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install the docs toolchain
        run: pip install -r docs/requirements.txt

      - name: Build the site
        # --strict fails the run on a broken page link or anchor, so a dead link
        # cannot be deployed. The output goes to its own directory: the copy that
        # ships inside the build belongs to the release job.
        run: python3 -m mkdocs build --strict -f docs/mkdocs.yml -d site-docs

      - name: Check the site is self-contained
        run: node docs/scripts/check-external-calls.mjs --site site-docs

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site-docs
          cname: server.sasjs.io
