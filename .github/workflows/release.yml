name: SASjs Server Executable Release

on:
  push:
    branches:
      - main

# One release at a time. Two merges minutes apart would otherwise start two
# release runs over the same history: the second finds its commits already
# covered, reports `skip`, and publishes nothing - while the first is still
# building. Queued rather than cancelled, because a run that is mid-publish must
# never be torn down (sasjs/server#520).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# read-only by default; the release job asks for the writes it needs, and a job block replaces this one rather than adding to it
permissions: read-all

jobs:
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # the tag, the draft release, its assets, and the PATCH that publishes it
      id-token: write  # npm trusted publishing (OIDC) and --provenance

    strategy:
      matrix:
        node-version: [lts/*]

    steps:
      # This job never pushes to main: the release API creates the tag at the
      # commit being released.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the version is classified from the tags, so a shallow clone would
          # see one commit and invent one
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      # Node 22 ships npm 10, and trusted publishing (OIDC) needs 11.5.1 or
      # later - with an older CLI `npm publish` looks for a token and fails
      # rather than exchanging the OIDC token. Floored, not floating: a newer
      # major that changed --provenance or trusted publishing would break this
      # job with nothing in the repository to review or revert.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      # The tool comes from the lockfile, so the bytes are pinned as well as the
      # version, on the one job that can tag and publish.
      - name: Install the release tool
        run: npm ci

      # The cut comes before anything is built, so every artefact below can name
      # the release it belongs to, and the assets have a release to attach to.
      # It is a DRAFT with no assets: a release published before its files exist
      # is one whose download links answer 404 until an attach finishes, which is
      # exactly what v7.24.3 shipped to `latest`.
      #
      # A failure after this step leaves an invisible draft and no npm entry -
      # but NOT a tag: GitHub creates the backing tag when a draft is published,
      # not when it is created (measured on this repository: a draft release with
      # a tag name that did not exist left /git/refs/tags/... 404). So a failed
      # cut burns no tag of its own and the commits stay uncovered until some
      # release covers them - which is what the paragraph below is about.
      #
      # Finish the run by RE-RUNNING IT: the cut classifies the same commits,
      # finds the draft it made last time and reuses it, the local tag it creates
      # is what `--prepare-publish` resolves, `publish` is true while the
      # registry lacks the version, and the job completes the release.
      #
      # A LATER merge is the case this pipeline depends on the tool for, and the
      # pinned version is what makes it safe: 0.13.2 is the first release that
      # compares the commit an existing release names with the commit being
      # released.
      #
      #   - a run at a newer commit classifies from the last PUBLISHED tag, so it
      #     computes the same version and finds the draft cut at the earlier
      #     commit. A tool that reused any release carrying that tag name would
      #     attach the newer build to it and publish the tag at the OLDER commit -
      #     a release whose files and tag disagree, with nothing warning;
      #   - with the comparison in place, a draft naming another commit is
      #     discarded and the release cut again here, so the merge is harmless:
      #     the earlier attempt stays invisible and its commits ship in the
      #     release after it.
      #
      # That is why the pin is exact: a downgrade below 0.13.2, or a switch back
      # to semantic-release, restores the mis-publish.
      - name: Tag and cut the draft release, if there is anything to release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release -- --host github --release --no-assets --draft --output "$GITHUB_OUTPUT"

      # What this run is finishing is decided from state, not from the cut. The
      # cut leaves a draft and a LOCAL tag in this runner only - nothing on the
      # forge covers those commits until the release is published - so the next
      # run classifies the same commits to the same version and this step is what
      # tells it whether that version still needs publishing. `released` cannot
      # answer that: a run that died before npm got the version reports the same
      # thing as one that finished. --prepare-publish answers from the tag and the
      # registry - skip, tag, version, publish, exists - and refuses a tag that is
      # not on main.
      #
      # Its answer is also checked rather than trusted: a run that exits 0 without
      # reporting a decision this workflow understands would otherwise leave every
      # later step skipped and the job green, having released nothing.
      - name: Resolve the version this run publishes, and ask the registry
        id: publish
        env:
          TAG: ${{ steps.release.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${TAG:-}" ]; then target=(--tag "$TAG"); else target=(--sha "$SHA"); fi
          decision=$(mktemp)
          npm run release -- --prepare-publish "${target[@]}" --branch main --output "$decision"
          if ! grep -qxE 'skip=(true|false)' "$decision"; then
            echo "::error::--prepare-publish reported no skip= decision, so this run cannot tell whether there is anything to publish:"
            cat "$decision"
            exit 1
          fi
          if grep -qx 'skip=false' "$decision" && ! grep -qE '^tag=[^[:space:]]+$' "$decision"; then
            echo "::error::--prepare-publish reported something to publish but named no tag:"
            cat "$decision"
            exit 1
          fi
          cat "$decision" >> "$GITHUB_OUTPUT"

      - name: Install Dependencies WEB
        if: steps.publish.outputs.tag != ''
        working-directory: ./web
        run: npm ci

      - name: Build WEB
        if: steps.publish.outputs.tag != ''
        working-directory: ./web
        run: npm run build
        env:
          CI: true

      # The pages ship inside the build, so the copy a reader opens describes
      # the release that carries it. Built after the client because they land in
      # the client's output directory.
      - name: Setup Python
        if: steps.publish.outputs.tag != ''
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Build DOCS
        if: steps.publish.outputs.tag != ''
        run: |
          pip install -r docs/requirements.txt
          node docs/scripts/mkdocs.mjs build --strict -f docs/mkdocs.yml

      - name: Install Dependencies API
        if: steps.publish.outputs.tag != ''
        working-directory: ./api
        run: npm ci

      # The release carries the newest core macros, not the version the lock
      # pins: the pin is what pull requests are tested against, and a release is
      # cut often enough that bumping it by hand every time is the thing this
      # avoids. Installed without touching package.json or the lock, so the
      # committed pin stays intact; the version actually installed is recorded
      # for buildInfo and the release notes, and a failed lookup falls back to
      # the pin rather than failing the release.
      - name: Take the newest @sasjs/core
        if: steps.publish.outputs.tag != ''
        run: node .github/scripts/take-latest-core.mjs

      # Same reason as the smoke workflow: `pkg` builds Node from source when its
      # base-binary download fails, and that build cannot compile on this image
      # (`deps/ada/ada.h` needs a newer libstdc++ than gcc 12). A 504 from the
      # release CDN then surfaces as a compiler error here. This job cross-builds
      # all three platforms, so all three base binaries are fetched up front,
      # retried and cached between runs.
      - name: Restore the pkg base binaries
        if: steps.publish.outputs.tag != ''
        id: pkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pkg-cache
          key: pkg-cache-${{ runner.os }}-release-${{ hashFiles('api/package-lock.json') }}

      - name: Fetch the pkg base binaries
        if: steps.publish.outputs.tag != ''
        shell: bash
        working-directory: ./api
        run: |
          # Each attempt is bounded: a 504 from the CDN can take minutes to come
          # back, and the point of this step is to fail quickly and say why. Node
          # runs the call rather than `timeout(1)`, which is absent on macOS.
          fetch() {
            node -e '
              const { spawnSync } = require("child_process")
              const args = ["--no-install", "pkg-fetch", "--node-range", "node24",
                            "--platform", process.argv[1], "--arch", "x64"]
              const result = spawnSync("npx", args, { stdio: "inherit", timeout: 90000 })
              process.exit(result.status === null ? 1 : result.status)
            ' "$1"
          }
          for platform in linux win macos; do
            for attempt in 1 2 3; do
              if fetch "$platform"; then
                echo "base binary ready for $platform-x64"
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "::error::pkg-fetch could not download the base Node binary for $platform-x64 after 3 attempts. This is the GitHub release CDN, not a change in this branch."
                exit 1
              fi
              echo "attempt $attempt failed for $platform; waiting $((attempt * 15))s"
              sleep $((attempt * 15))
            done
          done

      - name: Save the pkg base binaries
        if: success() && steps.publish.outputs.tag != '' && steps.pkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pkg-cache
          key: ${{ steps.pkg-cache.outputs.cache-primary-key }}

      - name: Build Executables
        if: steps.publish.outputs.tag != ''
        working-directory: ./api
        run: npm run exe
        env:
          CI: true
          # Stamped into the binary by scripts/generateBuildInfo.ts and served
          # by GET /SASjsApi/admin/diagnostics, so an operator can tell which
          # release a binary is without downloading it again.
          SASJS_SERVER_VERSION: ${{ steps.publish.outputs.tag }}
          SASJS_SERVER_GIT_HASH: ${{ github.sha }}
          # The macros come from the newest upstream tag rather than the pin;
          # downloadMacros records the tag and checksum it used, which
          # buildInfo then carries into the binary.
          SASJS_SAS_PACKAGES_LATEST: '1'
          # The resolved tag is verified against its tree through api.github.com,
          # which authenticates by token. Without one the request spends the
          # shared runner's unauthenticated budget, and a 403 there would quietly
          # turn the release into a pinned one.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The packaged binary is the only artefact this release ships that runs on
      # the small-icu Node `pkg` embeds, and nothing else in CI ever starts one.
      # Booting the exact file that is about to be zipped is seconds of work and
      # is the check that v3.10.0, v3.11.0 and v3.11.1 went out without - each of
      # them unable to write its first log line.
      - name: Smoke test the linux executable
        if: steps.publish.outputs.tag != ''
        run: node .github/scripts/smoke-executable.mjs executables/api-linux

      # Stage the npm package from the SAME build. `files` in the staged manifest
      # keeps the tarball to build/, web/build/, README and LICENSE, which is the
      # layout api/src/utils/file.ts derives its roots from - see the script's
      # header for the arithmetic.
      - name: Stage the npm package
        if: steps.publish.outputs.tag != ''
        run: node .github/scripts/stage-npm-package.mjs "${VERSION#v}" npm-package
        env:
          VERSION: ${{ steps.publish.outputs.version }}

      - name: Check the tarball carries exactly the runtime
        if: steps.publish.outputs.tag != ''
        working-directory: ./npm-package
        run: |
          set -euo pipefail
          npm pack --dry-run --json > /tmp/pack.json
          node -e "
          const report = require('/tmp/pack.json')[0]
          const files = report.files.map((f) => f.path)
          const unexpected = files.filter(
            (f) => !(f.startsWith('build/') || f.startsWith('web/build/') || f === 'README.md' || f === 'LICENSE' || f === 'package.json')
          )
          if (unexpected.length) {
            console.error('unexpected files in the tarball:')
            unexpected.forEach((f) => console.error('  ' + f))
            process.exit(1)
          }
          const required = ['build/src/server.js', 'web/build/index.html']
          const missing = required.filter((r) => !files.includes(r))
          if (missing.length) {
            console.error('missing from the tarball: ' + missing.join(', '))
            process.exit(1)
          }
          console.log('tarball: ' + files.length + ' files, ' + report.unpackedSize + ' bytes unpacked')
          "
      - name: Compress Executables
        if: steps.publish.outputs.tag != ''
        working-directory: ./executables
        run: |
          zip linux.zip api-linux
          zip macos.zip api-macos
          zip windows.zip api-win.exe

      - name: Generate SHA256 checksums
        if: steps.publish.outputs.tag != ''
        working-directory: ./executables
        run: |
          sha256sum linux.zip macos.zip windows.zip > SHA256SUMS
          cat SHA256SUMS

      # The release exists but is invisible, and the files are on disk. The tool
      # attaches them and reads the release back - every asset present, its size
      # matching, and its GitHub sha256 digest equal to the bytes it sent - and
      # --keep-draft leaves it invisible until npm has the version. That is the
      # check v7.24.3 needed: @semantic-release/github uploaded what it found and
      # said nothing about what it did not.
      - name: Attach the assets to the draft, and verify them
        if: steps.publish.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.publish.outputs.tag }}
        run: npm run release -- --attach "$TAG" --verify-assets --keep-draft

      # Gated on the registry's answer, not on this run having cut the tag: a
      # re-run that finds the version already on npm must skip the publish
      # rather than fail on it, and still finish the release below.
      #
      # Requires npm trusted publishing configured for @sasjs/server against this
      # repository and this workflow file. The FIRST publish of a new name needs
      # a token-authenticated run, because npm only offers the trusted-publisher
      # setting once the package exists.
      - name: Publish to npm
        if: steps.publish.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.publish.outputs.version }}
        run: |
          set -euo pipefail
          # The dist-tag decides what an unpinned `npx @sasjs/server` resolves,
          # so a prerelease must not land on latest - that is the silent upgrade
          # the README warns users about. `4.9.0-beta.1` publishes under `beta`.
          V="${VERSION#v}"
          case "$V" in
            *-*) TAG="${V#*-}"; TAG="${TAG%%.*}" ;;
            *) TAG=latest ;;
          esac
          echo "publishing $V under dist-tag $TAG"
          npm publish ./npm-package --provenance --access public --tag "$TAG"

      # The last step of a release: the assets are verified again and the draft
      # is what gets published, so a release is never public without its files.
      # Gated on tag discovery rather than on the publish, because a re-run that
      # found the version already on npm still has a draft to finalize.
      - name: Publish the verified release
        if: steps.publish.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.publish.outputs.tag }}
        run: npm run release -- --attach "$TAG" --verify-assets

      - name: Document the checksums on the release
        if: steps.publish.outputs.tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.publish.outputs.tag }}
        run: bash .github/scripts/add-verify-section.sh "$TAG"

      # What the release resolved, in the place a user reads: a release carries
      # the newest core and macro release, and this is the only record of which
      # ones it got - including when a lookup failed and the pin was used.
      - name: Document the upstream versions on the release
        if: steps.publish.outputs.tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.publish.outputs.tag }}
        run: bash .github/scripts/add-upstream-section.sh "$TAG"
