name: SASjs Server Executable Release

on:
  push:
    branches:
      - main

# One release at a time. Without this, two merges minutes apart start two
# release runs: the first builds and publishes, the second creates its tag and
# GitHub release and then fails at `npm publish` because the version is already
# taken - so the tag names a commit whose build never reached npm, and the npm
# entry carries the other run's build (sasjs/server#520).
#
# Queued rather than cancelled: a run that is mid-publish must never be torn
# down, and a run that waits reads the commits that arrived while it waited, so
# nothing is left unreleased. GitHub keeps one run per group, so a third merge
# replaces the waiting one - and that run still covers the commit it replaced,
# because it sees the same history.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# read-only by default; the release job asks for the writes it needs, and a job block replaces this one rather than adding to it
permissions: read-all

jobs:
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # semantic-release creates the tag and the GitHub release
      id-token: write  # npm trusted publishing (OIDC) and --provenance
      # @semantic-release/github comments on the PRs and issues a release
      # resolves. Without these two it gets a 403 AFTER the tag exists, which
      # leaves a release with no npm entry and no release notes.
      issues: write
      pull-requests: write

    strategy:
      matrix:
        node-version: [lts/*]

    steps:
      # This job never pushes to main: semantic-release creates the tag and the
      # release through the API.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # semantic-release needs the full history plus the existing tags.
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      # semantic-release is the authority on whether this commit releases
      # anything, so ask it BEFORE spending three minutes building three platform
      # executables. The plugin install plus the dry run costs about forty
      # seconds, and the build steps below are skipped whenever the answer is no
      # - which is every docs or chore merge on main.
      # Node 22 ships npm 10.x, and npm trusted publishing (OIDC) needs 11.5.1 or
      # later - with an older CLI `npm publish` looks for a token and fails
      # rather than exchanging the OIDC token. Same step the lint release runs.
      - name: Update npm
        # Floored, not floating: OIDC publishing needs 11.5.1, and a floating
        # npm major that changes --provenance or trusted publishing would break
        # this job with nothing in the repo to review or revert.
        run: npm install -g npm@^11.5.1

      - name: Install Semantic Release and plugins
        run: |
          npm i
          # pinned, not floating: the scorecard reads an unpinned global install as an
          # unpinned dependency, and a semantic-release major that changed the plugin
          # contract would break this job with nothing in the repository to revert
          npm i -g semantic-release@25.0.9

      # A change that only touches the documentation ships no code, so it is not
      # a release - the pages travel inside the next build, and cutting a
      # version for them alone fills the changelog with entries that describe no
      # behaviour. semantic-release already declines a `docs:` commit; this
      # declines a merge whose message says `fix` but whose diff says `docs/`.
      - name: Does this commit change anything but the docs?
        id: scope
        run: |
          set -euo pipefail
          before='${{ github.event.before }}'
          # A new branch, or a forced push: there is no range to inspect.
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "docsOnly=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$before" "$GITHUB_SHA" | grep -v '^docs/' || true)
          if [ -z "$changed" ]; then
            echo "docsOnly=true" >> "$GITHUB_OUTPUT"
            echo "Only docs/ changed: no release."
          else
            echo "docsOnly=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Is a release pending?
        id: pending
        if: steps.scope.outputs.docsOnly != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          semantic-release --dry-run 2>&1 | tee /tmp/dry-run.log
          if grep -q 'The next release version is' /tmp/dry-run.log; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            grep 'The next release version is' /tmp/dry-run.log
            # The tag does not exist yet, so `git describe` inside the build
            # would report the PREVIOUS release. Capture the version here and
            # pass it to the build through SASJS_SERVER_VERSION so the binary
            # names the release it is about to be published as.
            VERSION=$(grep -oE 'The next release version is [0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?' /tmp/dry-run.log | head -1 | awk '{print $NF}')
            # An empty value here would stamp every binary with the literal
            # "v" and publish a build that cannot name its own release - fail
            # the job instead of shipping that.
            if [ -z "$VERSION" ]; then
              echo "Could not parse the next version out of the dry-run output:"
              cat /tmp/dry-run.log
              exit 1
            fi
            echo "version=v$VERSION" >> "$GITHUB_OUTPUT"
            echo "Building as v$VERSION"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No release is pending for this commit: the build steps are skipped."
          fi

      - name: Install Dependencies WEB
        if: steps.pending.outputs.release == 'true'
        working-directory: ./web
        run: npm ci

      - name: Build WEB
        if: steps.pending.outputs.release == 'true'
        working-directory: ./web
        run: npm run build
        env:
          CI: true

      # The pages ship inside the build, so the copy a reader opens describes
      # the release that carries it. Built after the client because they land in
      # the client's output directory.
      - name: Setup Python
        if: steps.pending.outputs.release == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Build DOCS
        if: steps.pending.outputs.release == 'true'
        run: |
          pip install -r docs/requirements.txt
          node docs/scripts/mkdocs.mjs build --strict -f docs/mkdocs.yml

      - name: Install Dependencies API
        if: steps.pending.outputs.release == 'true'
        working-directory: ./api
        run: npm ci

      # Same reason as the smoke workflow: `pkg` builds Node from source when its
      # base-binary download fails, and that build cannot compile on this image
      # (`deps/ada/ada.h` needs a newer libstdc++ than gcc 12). A 504 from the
      # release CDN then surfaces as a compiler error here. This job cross-builds
      # all three platforms, so all three base binaries are fetched up front,
      # retried and cached between runs.
      - name: Restore the pkg base binaries
        if: steps.pending.outputs.release == 'true'
        id: pkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pkg-cache
          key: pkg-cache-${{ runner.os }}-release-${{ hashFiles('api/package-lock.json') }}

      - name: Fetch the pkg base binaries
        if: steps.pending.outputs.release == 'true'
        shell: bash
        working-directory: ./api
        run: |
          # Each attempt is bounded: a 504 from the CDN can take minutes to come
          # back, and the point of this step is to fail quickly and say why. Node
          # runs the call rather than `timeout(1)`, which is absent on macOS.
          fetch() {
            node -e '
              const { spawnSync } = require("child_process")
              const args = ["--no-install", "pkg-fetch", "--node-range", "node24",
                            "--platform", process.argv[1], "--arch", "x64"]
              const result = spawnSync("npx", args, { stdio: "inherit", timeout: 90000 })
              process.exit(result.status === null ? 1 : result.status)
            ' "$1"
          }
          for platform in linux win macos; do
            for attempt in 1 2 3; do
              if fetch "$platform"; then
                echo "base binary ready for $platform-x64"
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "::error::pkg-fetch could not download the base Node binary for $platform-x64 after 3 attempts. This is the GitHub release CDN, not a change in this branch."
                exit 1
              fi
              echo "attempt $attempt failed for $platform; waiting $((attempt * 15))s"
              sleep $((attempt * 15))
            done
          done

      - name: Save the pkg base binaries
        if: success() && steps.pending.outputs.release == 'true' && steps.pkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pkg-cache
          key: ${{ steps.pkg-cache.outputs.cache-primary-key }}

      - name: Build Executables
        if: steps.pending.outputs.release == 'true'
        working-directory: ./api
        run: npm run exe
        env:
          CI: true
          # Stamped into the binary by scripts/generateBuildInfo.ts and served
          # by GET /SASjsApi/admin/diagnostics, so an operator can tell which
          # release a binary is without downloading it again.
          SASJS_SERVER_VERSION: ${{ steps.pending.outputs.version }}
          SASJS_SERVER_GIT_HASH: ${{ github.sha }}
          # The api build lists the SAS_PACKAGES macros over the GitHub API,
          # which rate limits unauthenticated requests per source IP.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The packaged binary is the only artefact this release ships that runs on
      # the small-icu Node `pkg` embeds, and nothing else in CI ever starts one.
      # Booting the exact file that is about to be zipped is seconds of work and
      # is the check that v3.10.0, v3.11.0 and v3.11.1 went out without - each of
      # them unable to write its first log line.
      - name: Smoke test the linux executable
        if: steps.pending.outputs.release == 'true'
        run: node .github/scripts/smoke-executable.mjs executables/api-linux

      # Stage the npm package from the SAME build. `files` in the staged manifest
      # keeps the tarball to build/, web/build/, README and LICENSE, which is the
      # layout api/src/utils/file.ts derives its roots from - see the script's
      # header for the arithmetic.
      - name: Stage the npm package
        if: steps.pending.outputs.release == 'true'
        run: node .github/scripts/stage-npm-package.mjs "${VERSION#v}" npm-package
        env:
          VERSION: ${{ steps.pending.outputs.version }}

      - name: Check the tarball carries exactly the runtime
        if: steps.pending.outputs.release == 'true'
        working-directory: ./npm-package
        run: |
          set -euo pipefail
          npm pack --dry-run --json > /tmp/pack.json
          node -e "
          const report = require('/tmp/pack.json')[0]
          const files = report.files.map((f) => f.path)
          const unexpected = files.filter(
            (f) => !(f.startsWith('build/') || f.startsWith('web/build/') || f === 'README.md' || f === 'LICENSE' || f === 'package.json')
          )
          if (unexpected.length) {
            console.error('unexpected files in the tarball:')
            unexpected.forEach((f) => console.error('  ' + f))
            process.exit(1)
          }
          const required = ['build/src/server.js', 'web/build/index.html']
          const missing = required.filter((r) => !files.includes(r))
          if (missing.length) {
            console.error('missing from the tarball: ' + missing.join(', '))
            process.exit(1)
          }
          console.log('tarball: ' + files.length + ' files, ' + report.unpackedSize + ' bytes unpacked')
          "
      # The tarball check above reads the file LIST; this runs the package. It is
      # the only job that installs as a user installs (`--omit=dev`) and boots, and
      # it exists because 6.0.0 passed every other check while being unable to
      # start: `adm-zip` was a devDependency, so the list was correct and the
      # runtime was not.
      - name: Smoke test the npm package as installed
        if: steps.pending.outputs.release == 'true'
        run: node .github/scripts/smoke-npm-package.mjs npm-package

      - name: Compress Executables
        if: steps.pending.outputs.release == 'true'
        working-directory: ./executables
        run: |
          zip linux.zip api-linux
          zip macos.zip api-macos
          zip windows.zip api-win.exe

      - name: Generate SHA256 checksums
        if: steps.pending.outputs.release == 'true'
        working-directory: ./executables
        run: |
          sha256sum linux.zip macos.zip windows.zip > SHA256SUMS
          cat SHA256SUMS

      # Deliberately ungated: the dry run above is a cost gate, while this is
      # the real release. Running it unconditionally keeps one source of truth,
      # and means a change to semantic-release's log wording can never silently
      # suppress a release.
      - name: Release
        run: |
          GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} semantic-release

      # Publishing after the tag exists keeps the published version and the tag in
      # step: a publish failure then leaves a release without its npm entry, which
      # is visible and retryable, rather than an npm version with no tag.
      #
      # Requires npm trusted publishing configured for @sasjs/server against this
      # repository and this workflow file. The FIRST publish of a new name needs a
      # token-authenticated run, because npm only offers the trusted-publisher
      # setting once the package exists.
      - name: Publish to npm
        if: steps.pending.outputs.release == 'true'
        env:
          VERSION: ${{ steps.pending.outputs.version }}
        run: |
          set -euo pipefail
          # The dist-tag decides what an unpinned `npx @sasjs/server` resolves,
          # so a prerelease must not land on latest - that is the silent upgrade
          # the README warns users about. `4.9.0-beta.1` publishes under `beta`.
          V="${VERSION#v}"
          case "$V" in
            *-*) TAG="${V#*-}"; TAG="${TAG%%.*}" ;;
            *) TAG=latest ;;
          esac
          echo "publishing $V under dist-tag $TAG"
          npm publish ./npm-package --provenance --access public --tag "$TAG"

      - name: Document the checksums on the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The tag is created on the REMOTE by the github plugin (nothing makes
          # one locally now that the changelog plugin is gone), so fetch it
          # before asking which tag points at HEAD. An empty result still means
          # this push produced no release.
          git fetch --tags --force
          TAG=$(git tag --points-at HEAD | head -n1)
          if [ -z "$TAG" ]; then
            echo "No release was created for this commit - skipping."
            exit 0
          fi
          bash .github/scripts/add-verify-section.sh "$TAG"
