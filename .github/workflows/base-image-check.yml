name: Base image check

# The container image is pinned by tag AND digest, so the OS packages it carries
# only move when somebody bumps the pin deliberately. Cloudron republishes the
# base image monthly with the security updates of the day, and every day in
# between adds CVEs to the snapshot the image was built from - which is what the
# Trivy OS gate in container.yml then reports, on whatever unrelated pull
# request happens to run next.
#
# This keeps the pin current without a human remembering to look:
#
# - one fixed head branch, so a later run updates the OPEN pull request instead
#   of opening a second one;
# - it stands down when somebody else already has a base-image bump open;
# - it closes its own pull request when the pin is already on the newest tag.
on:
  schedule:
    # Mondays at 04:43 UTC. The odd minute avoids the top-of-hour queue, and a
    # weekly look matches a monthly republish.
    - cron: '43 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: base-image-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          # an App token, so the push raises pull_request events and the bump's
          # own checks run - a GITHUB_TOKEN push raises nothing, which left the
          # Trivy gate this PR relies on unexecuted
          token: ${{ steps.app-token.outputs.token }}
        with:
          # The branch is rebuilt from the default branch on every run, and the
          # comparison reads the committed Dockerfile, so history is not needed
          # beyond the checkout - but a shallow clone cannot force-push cleanly.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Is the pin behind the newest base image?
        id: pin
        run: node .github/scripts/base-image-bump.mjs

      - name: Open or update the bump pull request
        if: steps.pin.outputs.stale == 'true'
        env:
          # the App token: gh opens and edits the pull request as the App, and the
          # push below inherits it through the checkout's credential
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: chore/base-image-bump
          NEXT_TAG: ${{ steps.pin.outputs.nextTag }}
          NEXT_DIGEST: ${{ steps.pin.outputs.nextDigest }}
          CURRENT_TAG: ${{ steps.pin.outputs.currentTag }}
        run: |
          set -euo pipefail

          # One open pull request, whoever opened it: if another branch already
          # proposes a base-image bump, this run stands down rather than adding a
          # second opinion.
          # judged by the files a pull request touches, not its title: a human
          # bump titled "refresh node base" would otherwise be invisible. Narrowed
          # to a pull request that changes ONLY the Dockerfile, so an unrelated
          # change that happens to touch it cannot suspend this job for weeks.
          others="$(gh pr list --state open --limit 200 --json number,headRefName,files \
            | jq -r --arg branch "$BRANCH" \
                '[.[] | select(.headRefName != $branch)
                     | select((.files | length) > 0)
                     | select(all(.files[]?; .path == "container/Dockerfile"))
                     | .number] | first // empty')"
          if [ -n "$others" ]; then
            # surfaced, not swallowed: a weekly no-op that says nothing is
            # indistinguishable from "nothing to do"
            echo "::warning title=Base image bump suspended::pull request #${others} already proposes a base-image bump"
            exit 0
          fi

          # --tag: resolve once. Without it the script looks the newest tag up
          # again, and a tag published in between would be written while the
          # commit, PR title and body all quote the first one.
          node .github/scripts/base-image-bump.mjs --write --tag "$NEXT_TAG"

          # A human (or a merge) may have moved the pin between the check and
          # here; then there is nothing to commit and this run is a no-op.
          if git diff --quiet -- container/Dockerfile; then
            echo "the pin is already on ${NEXT_TAG}; nothing to commit"
            exit 0
          fi

          # a digest-only move keeps the tag, so naming the tag alone would say
          # "bump the base image to 24-20260920" while it is already on it
          TITLE="chore(container): bump the base image to ${NEXT_TAG}"
          if [ "${NEXT_TAG}" = "${CURRENT_TAG}" ]; then
            TITLE="chore(container): move the base image pin for ${NEXT_TAG}"
          fi

          git config user.name "sasjs"
          git config user.email "sasjs@4gl.io"
          git checkout -B "$BRANCH"
          git add container/Dockerfile
          git commit -m "$TITLE"
          git push --force-with-lease origin "$BRANCH"

          cat > /tmp/base-image-body.md <<BODY
          The container's OS-layer gate reported CVEs against the package snapshot
          \`${CURRENT_TAG}\` was built from. Cloudron has republished the image since, so
          the pin moves to \`${NEXT_TAG}\`:

          \`\`\`
          FROM cloudron/node-base:${NEXT_TAG}@${NEXT_DIGEST}
          \`\`\`

          The digest stays pinned, so the build stays reproducible - this is the deliberate
          bump the Dockerfile's own comment asks for, made on a schedule rather than when a
          pull request goes red.

          CI verifies it, because an OS scan only means anything against the built image:
          \`Container build and scan\` runs Trivy over it and gates on HIGH and CRITICAL. The
          branch is pushed with a GitHub App token rather than \`GITHUB_TOKEN\`, so those
          checks run on this pull request instead of waiting for an approval.
          BODY

          # one number: the branch is fixed, so any other match is a duplicate of
          # the same review, and `gh pr edit` rejects a newline-joined list
          existing="$(gh pr list --state open --limit 200 --head "$BRANCH" --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body-file /tmp/base-image-body.md
          else
            # The branch is fixed, so this is the same pull request: keep its
            # title and body on the tag it now proposes.
            gh pr edit "$existing" \
              --title "$TITLE" \
              --body-file /tmp/base-image-body.md
            echo "updated pull request #$existing"
          fi

      - name: Close a bump pull request that is no longer needed
        if: steps.pin.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_TAG: ${{ steps.pin.outputs.nextTag }}
        run: |
          set -euo pipefail

          number="$(gh pr list --state open --limit 200 --head chore/base-image-bump --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            echo "pin is current at ${NEXT_TAG}; no pull request to close"
            exit 0
          fi

          gh pr close "$number" --comment \
            "The pin is already on \`${NEXT_TAG}\`, the newest base image in this node major, so there is nothing left to bump. Closing rather than leaving a stale pull request open."
