name: SASjs Server Build

on:
  pull_request:
  # Also run on main, because release.yml (the only other workflow triggered by
  # a push to main) builds the executables but never runs the test suite. It
  # type-checks via `npm run exe` -> tsc, so a type error on main is caught
  # there, but a failing test would not be - it would sit on main unnoticed
  # until the next pull request happened to run it.
  push:
    branches:
      - main

# A newer commit on the same branch supersedes an in-flight run, so a busy
# merge period does not queue up stale runs. Safe here: these jobs only read
# and test, they do not publish anything (that is release.yml).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Use Node.js lts/*
        uses: actions/setup-node@v2
        with:
          node-version: lts/*

      - name: Install root dependencies
        # --ignore-scripts: no install script from any dependency runs; the
        # gitleaks binary below is a plain devDependency binary, no
        # postinstall needed.
        run: npm ci --ignore-scripts

      - name: Scan for secrets (gitleaks)
        # The local pre-commit hook is best-effort (and suppressed entirely
        # when .npmrc sets ignore-scripts=true), so CI is the enforcement
        # point: a leaked credential must fail the build, not just a commit.
        # Uses the same @nogoo9/gitleaks binary the pre-commit hook pins - the
        # gitleaks-action requires a license key for organization repos.
        run: node_modules/.bin/gitleaks detect --source . --redact --no-banner -v

      - name: Audit root dependencies
        run: npm audit --omit=dev

      - name: Audit API dependencies
        # Fails the build on any known vulnerability, dev deps included -
        # the same bar the pre-commit hook and local verification use.
        working-directory: ./api
        run: npm ci --ignore-scripts && npm audit --audit-level=low

      - name: Audit Web dependencies (critical only)
        # web/ still carries 6 moderate + 1 high advisory that need breaking
        # bumps (react-router 6->7, copy-webpack-plugin 14, webpack-dev-server
        # 6) - tracked for a dedicated web-deps PR. Until then this step only
        # fails the build on a CRITICAL finding, so a new critical advisory
        # cannot land silently.
        working-directory: ./web
        run: npm ci --ignore-scripts && npm audit --audit-level=critical

  lint:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        node-version: [lts/*]

    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: npm ci

      - name: Check Api Code Style
        run: npm run lint-api

      - name: Check Web Code Style
        run: npm run lint-web

  build-api:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        node-version: [lts/*]

    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        working-directory: ./api
        run: npm ci

      - name: Warm mongod binary for tests
        # ignore-scripts=true (api/.npmrc) suppresses mongodb-memory-server's
        # postinstall pre-download; without this step the first spec's
        # MongoMemoryServer.create() downloads ~120MB inside jest's 5s hook
        # timeout. Doing it here both warms the cache and proves the suite no
        # longer depends on any install script.
        working-directory: ./api
        run: node -e "require('mongodb-memory-server').MongoMemoryServer.create().then(s => s.stop()).then(() => console.log('mongod cached'))"

      - name: Run Unit Tests
        working-directory: ./api
        run: npm test
        env:
          CI: true
          MODE: 'server'
          ACCESS_TOKEN_SECRET: ${{secrets.ACCESS_TOKEN_SECRET}}
          REFRESH_TOKEN_SECRET: ${{secrets.REFRESH_TOKEN_SECRET}}
          AUTH_CODE_SECRET: ${{secrets.AUTH_CODE_SECRET}}
          SESSION_SECRET: ${{secrets.SESSION_SECRET}}
          RUN_TIMES: 'sas,js'
          SAS_PATH: '/some/path/to/sas'
          NODE_PATH: '/some/path/to/node'

      - name: Build Package
        working-directory: ./api
        run: npm run build
        env:
          CI: true

  build-web:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        node-version: [lts/*]

    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        working-directory: ./web
        run: npm ci

      # TODO: Uncomment next step when unit tests provided
      # - name: Run Unit Tests
      #   working-directory: ./web
      #   run: npm test

      - name: Build Package
        working-directory: ./web
        run: npm run build
        env:
          CI: true
