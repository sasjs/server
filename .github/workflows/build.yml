name: SASjs Server Build

on:
  pull_request:
  # Also run on main, because release.yml (the only other workflow triggered by
  # a push to main) builds the executables but never runs the test suite. It
  # type-checks via `npm run exe` -> tsc, so a type error on main is caught
  # there, but a failing test would not be - it would sit on main unnoticed
  # until the next pull request happened to run it.
  push:
    branches:
      - main

# A newer commit on the same branch supersedes an in-flight run, so a busy
# merge period does not queue up stale runs. Safe here: these jobs only read
# and test, they do not publish anything (that is release.yml).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js lts/*
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install root dependencies
        # --ignore-scripts: no install script from any dependency runs; the
        # gitleaks binary below is a plain devDependency binary, no
        # postinstall needed.
        run: npm ci --ignore-scripts

      - name: Scan for secrets (gitleaks)
        # The local pre-commit hook is best-effort (and suppressed entirely
        # when .npmrc sets ignore-scripts=true), so CI is the enforcement
        # point: a leaked credential must fail the build, not just a commit.
        # Uses the same @nogoo9/gitleaks binary the pre-commit hook pins - the
        # gitleaks-action requires a license key for organization repos.
        run: node_modules/.bin/gitleaks detect --source . --redact --no-banner -v

      - name: Audit root dependencies
        run: npm audit --omit=dev

      - name: Audit API dependencies
        # Fails the build on any known vulnerability, dev deps included -
        # the same bar the pre-commit hook and local verification use. The
        # allow-list in .github/scripts/audit.mjs carries advisories with no
        # patched release upstream, each with the reason it cannot be fixed;
        # matching is by GHSA id, so a NEW advisory against the same package
        # still fails the build.
        working-directory: ./api
        run: npm ci --ignore-scripts && node ../.github/scripts/audit.mjs

      - name: Audit Web dependencies
        # Production dependencies only. The dev toolchain carries an advisory
        # that no upgrade clears: braces GHSA-vfj7-8cjw-p6xm, reached through
        # webpack-cli -> webpack-dev-server -> http-proxy-middleware ->
        # micromatch, and braces has published no fixed release. It is a
        # build-time denial of service in a tool that never ships, so the
        # production set is what this gate covers - the same scope the root
        # audit uses. The two react-router moderates cleared with
        # react-router-dom 7, so the level is back to the default.
        working-directory: ./web
        run: npm ci --ignore-scripts && npm audit --omit=dev

  lint:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        node-version: [lts/*]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: npm ci

      - name: Check Api Code Style
        run: npm run lint-api

      - name: Check Web Code Style
        run: npm run lint-web

  build-api:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        node-version: [lts/*]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        working-directory: ./api
        run: npm ci

      - name: Warm mongod binary for tests
        # ignore-scripts=true (api/.npmrc) suppresses mongodb-memory-server's
        # postinstall pre-download; without this step the first spec's
        # MongoMemoryServer.create() downloads ~120MB inside jest's 5s hook
        # timeout. Doing it here both warms the cache and proves the suite no
        # longer depends on any install script.
        working-directory: ./api
        run: node -e "require('mongodb-memory-server').MongoMemoryServer.create().then(s => s.stop()).then(() => console.log('mongod cached'))"

      - name: Run Unit Tests
        working-directory: ./api
        run: npm test
        env:
          CI: true
          MODE: 'server'
          ACCESS_TOKEN_SECRET: ${{secrets.ACCESS_TOKEN_SECRET}}
          REFRESH_TOKEN_SECRET: ${{secrets.REFRESH_TOKEN_SECRET}}
          AUTH_CODE_SECRET: ${{secrets.AUTH_CODE_SECRET}}
          SESSION_SECRET: ${{secrets.SESSION_SECRET}}
          RUN_TIMES: 'sas,js'
          SAS_PATH: '/some/path/to/sas'
          NODE_PATH: '/some/path/to/node'

      - name: Build Package
        working-directory: ./api
        run: npm run build
        env:
          CI: true
          # The api build lists the SAS_PACKAGES macros over the GitHub API,
          # which rate limits unauthenticated requests per source IP.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-web:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        node-version: [lts/*]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        working-directory: ./web
        run: npm ci

      - name: Run Unit Tests
        working-directory: ./web
        run: npm test

      - name: Build Package
        working-directory: ./web
        run: npm run build
        env:
          CI: true

  # The browser suite (jest.e2e.config.js). It is excluded from the unit run on
  # purpose - it needs a web build, a browser and a database - but nothing else
  # ran it, so a regression in the Studio interface could merge unnoticed. That
  # is exactly how the drive sidebar came to render nothing at all. It writes a
  # program into a throwaway drive, so it needs no SAS binary: the runtimes under
  # test are js only.
  e2e:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js lts/*
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install web dependencies
        working-directory: ./web
        run: npm ci

      # The API serves the client from ../web/build, and the spec refuses to run
      # without it rather than silently testing a stale bundle.
      - name: Build the web client
        working-directory: ./web
        run: npm run build
        env:
          CI: true

      - name: Install api dependencies
        working-directory: ./api
        run: npm ci

      - name: Warm mongod binary for tests
        # Same reason as build-api: ignore-scripts=true suppresses
        # mongodb-memory-server's postinstall download, and the first spec
        # creates a server inside jest's hook timeout.
        working-directory: ./api
        run: node -e "require('mongodb-memory-server').MongoMemoryServer.create().then(s => s.stop()).then(() => console.log('mongod cached'))"

      - name: Install Chromium for playwright
        working-directory: ./api
        run: npx playwright install --with-deps chromium

      - name: Run the browser tests
        working-directory: ./api
        # setupEnv.ts sets MODE/RUN_TIMES/NODE_PATH for the suite but no
        # listener, and verifyEnvVariables exits 1 without one.
        env:
          CI: true
          HTTP_PORT: '5000'
        run: npm run test:e2e

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: api/src/e2e/screenshots
          if-no-files-found: ignore

  # End-to-end verification of MODE=server against a real database: boot, health
  # check, the real login -> authorize -> token flow, and a JavaScript and a
  # Python stored program. This is what the withdrawn container smoke test
  # covered; it runs the built server directly rather than an image, so
  # withdrawing the image does not withdraw the only integration test of
  # multi-user auth.
  integration:
    runs-on: ubuntu-22.04

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js lts/*
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install web dependencies
        working-directory: ./web
        run: npm ci

      # The api build copies ../web/build into its own tree, so the client has to
      # be built first
      - name: Build the web client
        working-directory: ./web
        run: npm run build

      - name: Install api dependencies
        working-directory: ./api
        run: npm ci

      - name: Build the server
        working-directory: ./api
        run: npm run build

      # A fresh database per run: the server only logs its seed lines the first
      # time it creates the admin account, and ADMIN_PASSWORD_INITIAL is required
      # with AUTH_PROVIDERS empty (there is no external provider to bootstrap the
      # first user through). The flow below changes the password immediately.
      - name: Boot in server mode against MongoDB
        working-directory: ./api
        env:
          MODE: server
          DB_CONNECT: mongodb://127.0.0.1:27017/sasjs_smoke_${{ github.run_id }}_${{ github.run_attempt }}
          DB_TYPE: mongodb
          AUTH_PROVIDERS: ''
          RUN_TIMES: js,py
          # the account the flow below signs in as; without it the seed uses its
          # own default name
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD_INITIAL: smoke-test-initial-password
          HTTP_PORT: 5000
        run: |
          set -eu
          # the js and py runtimes refuse to boot without the interpreter paths
          export NODE_PATH="$(command -v node)"
          export PYTHON_PATH="$(command -v python3)"

          nohup node build/src/server.js > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid

          for i in $(seq 1 90); do
            if curl -sf -m 3 http://127.0.0.1:5000/SASjsApi/info > /tmp/info.json; then
              echo "health check passed after ${i}s"
              break
            fi
            sleep 1
          done

          cat /tmp/info.json
          jq -e '.mode == "server"' /tmp/info.json
          jq -e '.runTimes == ["js","py"]' /tmp/info.json

      # Server mode (unlike desktop mode) puts the Drive and Stored Program routes
      # behind a token, so this drives the real auth flow. The CSRF token is bound
      # to the session that minted it, so the cookie jar is kept across the scrape
      # and every POST; it arrives as a Set-Cookie header on the home page, which
      # is why it is read from the jar rather than the body.
      - name: Authenticate
        run: |
          set -eu
          API=http://127.0.0.1:5000

          curl -s -c /tmp/cookies -o /tmp/index.html -w 'GET / -> HTTP %{http_code}\n' "$API/"
          CSRF=$(awk '$6 == "XSRF-TOKEN" { print $7 }' /tmp/cookies)
          test -n "$CSRF"

          PW=smoke-test-initial-password

          curl -s -b /tmp/cookies -c /tmp/cookies -o /tmp/login.json -w 'login -> HTTP %{http_code}\n' \
            -X POST "$API/SASLogon/login" \
            -H "x-xsrf-token: $CSRF" -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$PW\"}"
          cat /tmp/login.json
          jq -e '.loggedIn == true' /tmp/login.json

          curl -sf -b /tmp/cookies -c /tmp/cookies -X PATCH "$API/SASjsApi/auth/updatePassword" \
            -H "x-xsrf-token: $CSRF" -H 'Content-Type: application/json' \
            -d "{\"currentPassword\":\"$PW\",\"newPassword\":\"smoke-test-password-1\"}" \
            -w 'updatePassword -> HTTP %{http_code}\n'

          CODE=$(curl -sf -b /tmp/cookies -c /tmp/cookies \
            -X POST "$API/SASLogon/authorize" \
            -H "x-xsrf-token: $CSRF" -H 'Content-Type: application/json' \
            -d '{"clientId":"clientID1"}' | jq -r '.code')
          test -n "$CODE"

          curl -sf -X POST "$API/SASjsApi/auth/token" \
            -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"clientID1\",\"code\":\"$CODE\"}" \
            | jq -r '.accessToken' > /tmp/token
          test -s /tmp/token

      - name: Execute a JavaScript and a Python stored program
        run: |
          set -eu
          API=http://127.0.0.1:5000
          TOKEN=$(cat /tmp/token)

          printf '%s\n' \
            "console.log('js program ran')" \
            "_webout = JSON.stringify({from:'js',marker:'js-ok'})" > /tmp/hello.js

          printf '%s\n' \
            "import json" \
            "print('py program ran')" \
            "with open(_WEBOUT,'w') as f: f.write(json.dumps({'from':'py','marker':'py-ok'}))" > /tmp/hello.py

          curl -sf -X POST "$API/SASjsApi/drive/file?_filePath=/Public/hello.js" \
            -H "Authorization: Bearer $TOKEN" -F "file=@/tmp/hello.js"
          curl -sf -X POST "$API/SASjsApi/drive/file?_filePath=/Public/hello.py" \
            -H "Authorization: Bearer $TOKEN" -F "file=@/tmp/hello.py"

          curl -s "$API/SASjsApi/stp/execute?_program=/Public/hello.js" \
            -H "Authorization: Bearer $TOKEN" > /tmp/js.json
          curl -s "$API/SASjsApi/stp/execute?_program=/Public/hello.py" \
            -H "Authorization: Bearer $TOKEN" > /tmp/py.json

          echo "hello.js -> $(cat /tmp/js.json)"
          echo "hello.py -> $(cat /tmp/py.json)"

          jq -e '.marker == "js-ok"' /tmp/js.json
          jq -e '.marker == "py-ok"' /tmp/py.json

      # The sign-in path calls the global fetch, which pkg binaries targeting
      # node16 did not have; this is the step that catches that class of break.
      - name: Assert the OIDC sign-in route redirects to the provider
        run: |
          set -eu
          kill "$(cat /tmp/server.pid)" 2>/dev/null || true

          nohup python3 .github/scripts/stub-idp.py 8899 > /tmp/idp.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8899/.well-known/openid-configuration > /dev/null && break
            sleep 0.5
          done

          export NODE_PATH="$(command -v node)"
          export PYTHON_PATH="$(command -v python3)"

          cd api
          MODE=server \
            DB_CONNECT="mongodb://127.0.0.1:27017/sasjs_oidc_${{ github.run_id }}_${{ github.run_attempt }}" \
            DB_TYPE=mongodb \
            AUTH_PROVIDERS=oidc \
            RUN_TIMES=js,py \
            OIDC_CLIENT_ID=sasjs-ci-client \
            OIDC_CLIENT_SECRET=ci-secret \
            OIDC_DISCOVERY_URL=http://127.0.0.1:8899/.well-known/openid-configuration \
            OIDC_ISSUER_URL=http://127.0.0.1:8899 \
            OIDC_PROVIDER_NAME=CI \
            OIDC_REDIRECT_URI=http://127.0.0.1:5000/SASLogon/openid/callback \
            HTTP_PORT=5000 \
            nohup node build/src/server.js > /tmp/server-oidc.log 2>&1 &
          cd ..

          for i in $(seq 1 90); do
            curl -sf -m 3 http://127.0.0.1:5000/SASjsApi/info > /dev/null && break
            sleep 1
          done

          LOC=$(curl -s -D - -o /dev/null http://127.0.0.1:5000/SASLogon/openid \
            | grep -i '^location:' | tr -d '\r')
          echo "$LOC"
          echo "$LOC" | grep -q 'http://127.0.0.1:8899/authorize'
          echo "$LOC" | grep -q 'client_id=sasjs-ci-client'
          # percent-encoded in full: the app encodes ':' as well as '/'. This is
          # the only guard on the client encoding its own callback.
          echo "$LOC" | grep -q 'redirect_uri=http%3A%2F%2F127.0.0.1%3A5000%2FSASLogon%2Fopenid%2Fcallback'
          echo "$LOC" | grep -q 'scope=openid'
          echo "$LOC" | grep -q 'state='

      - name: Server logs on failure
        if: failure()
        run: |
          tail -n 200 /tmp/server.log || true
          tail -n 200 /tmp/server-oidc.log || true
          tail -n 100 /tmp/idp.log || true
