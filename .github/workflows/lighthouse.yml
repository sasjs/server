name: Lighthouse

# Measures the site the way a reader loads it, on every pull request, and prints
# the scores into the job summary.
#
# It builds the whole mock site rather than only the documentation, because the
# interface is the part a visitor spends time in - Studio, the Drive and the Apps
# screen are a client-rendered bundle each, and measuring only the docs would
# leave the heaviest surface unmeasured. The docs are measured too, at the paths
# the site serves them from.
#
# It builds and serves here rather than measuring the published site: a pull
# request should be judged on its own build, not on whatever is live.

on:
  pull_request:

permissions: read-all

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-22.04

    # The scores are posted on the pull request as well as the job summary, which
    # is what a reviewer reads; nothing else here writes to the repository.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            api/package-lock.json

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: '3.12'

      - name: Docs dependencies
        run: pip install -r docs/requirements.txt

      - name: Web dependencies
        run: npm ci --prefix web

      # The API page's stylesheet and bundle are generated from swagger-ui-dist,
      # which the API installs - without this the site carries a page with
      # nothing to draw it with.
      - name: API dependencies
        run: npm ci --prefix api

      - name: API documentation assets
        run: npm run swagger-ui:copy --prefix api

      - name: Test the build's retry
        # The retry that waits out a registry publish window only fails in a
        # deploy, so the rule is asserted rather than discovered there.
        run: npm run mock:test

      # Builds the docs into the web bundle, compiles and builds the site with
      # the released CLI (pinned in mock/build.mjs), and lays out what a static
      # host needs.
      - name: Build the mock site
        run: npm run mock:build

      - name: Serve the site
        run: |
          cd sasjsbuild/mock
          python3 -m http.server 8787 >/dev/null 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8787/ >/dev/null; then
              echo "serving on http://localhost:8787"
              exit 0
            fi
            sleep 1
          done
          echo "the site did not come up" >&2
          exit 1

      - name: Run Lighthouse
        # The config asks for three runs per page and the median, which is what
        # makes the numbers comparable between pull requests.
        run: npx --yes @lhci/cli@0.14.0 autorun --config=docs/lighthouserc.json

      - name: Print the scores
        if: always()
        run: node docs/scripts/lighthouse-summary.mjs

      - name: Post the scores to the pull request
        # Only for branches in this repository: a pull request from a fork gets a
        # read-only token, so the comment would fail rather than report.
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -f lighthouse-summary.md ]; then
            echo "no summary to post"
            exit 0
          fi

          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- lighthouse-scores -->")) | .id' \
            | head -1)

          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" \
              -F body=@lighthouse-summary.md > /dev/null
            echo "updated comment $existing"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" \
              -F body=@lighthouse-summary.md > /dev/null
            echo "posted a new comment"
          fi

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: lighthouse-reports
          if-no-files-found: ignore
